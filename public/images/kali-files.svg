<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" role="img" aria-labelledby="title desc">
  <title id="title">Два файла готовой машины Kali</title>
  <desc id="desc">vbox — настройки машины, открыть в VirtualBox. vdi — её диск, оставить рядом. Это схема, не снимок экрана.</desc>
  <rect width="720" height="236" rx="16" fill="#141e16"/>
  <g font-family="Arial, sans-serif">
    <text x="24" y="34" fill="#aabc9e" font-size="13">СХЕМА · ВНУТРИ РАСПАКОВАННОЙ ПАПКИ</text>
    <rect x="22" y="54" width="328" height="156" rx="12" fill="#202f1b" stroke="#a8d46b"/>
    <rect x="370" y="54" width="328" height="156" rx="12" fill="#1b262d" stroke="#7d9fae"/>
    <path d="M44 78h33l14 14v47H44z" fill="#bde781"/><path d="M413 78h33l14 14v47h-47z" fill="#81b5c6"/>
    <text x="110" y="115" fill="#e2f0d8" font-size="29" font-weight="bold">.vbox</text>
    <text x="479" y="115" fill="#e2f0d8" font-size="29" font-weight="bold">.vdi</text>
    <text x="44" y="167" fill="#d9e9c9" font-size="16">Открыть в VirtualBox</text>
    <text x="44" y="192" fill="#aabc9e" font-size="13">Настройки готовой машины</text>
    <text x="392" y="167" fill="#d3e5e9" font-size="16">Оставить в этой папке</text>
    <text x="392" y="192" fill="#a8bac2" font-size="13">Виртуальный диск с Kali</text>
  </g>
</svg>
