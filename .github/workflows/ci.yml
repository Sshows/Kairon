name: Foundation CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kairon_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: kairon-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d kairon_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DIRECT_URL: postgresql://postgres:kairon-ci-only@localhost:5432/kairon_ci
      AUTH_SECRET: ephemeral-ci-secret-only-never-for-deployment-0123456789
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Downloadable Kali exercises
        run: python3 -B tests/kali_kit_test.py -v
      - name: Company security case files
        run: python3 -B tests/company_kit_test.py -v
      - name: Original offline Python projects
        run: python3 -B tests/projects_kit_test.py -v
      - name: Foundation examples and decisions
        run: python3 -B tests/basics_kit_test.py -v
      - name: Inert file-analysis evidence
        run: python3 -B tests/analysis_kit_test.py -v
      - name: Service diagnostics case files
        run: python3 -B tests/diagnostics_kit_test.py -v
      - run: npm run db:migrate
      - run: npm run db:provision
      - run: npm run db:check
      - run: npm run build
      - name: Browser provided by GitHub runner
        run: google-chrome --version
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - name: Public UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-learning-ui
          path: test-results/public-*.png
          if-no-files-found: ignore
          retention-days: 3
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: kairon-production
      cancel-in-progress: false
    environment: production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pull Vercel production configuration
        run: npx --yes vercel@65.2.0 pull --yes --environment production --scope "$VERCEL_ORG_ID"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build production output
        run: npx --yes vercel@65.2.0 build --prod --scope "$VERCEL_ORG_ID"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Deploy verified main
        run: npx --yes vercel@65.2.0 deploy --prebuilt --prod --yes --scope "$VERCEL_ORG_ID"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Check public health endpoint
        run: curl --fail --retry 3 --retry-delay 5 https://kairon-phi.vercel.app/api/health
